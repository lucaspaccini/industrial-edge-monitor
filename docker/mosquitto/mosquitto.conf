# Local single-host development/deployment broker.
# Anonymous, unencrypted MQTT is intentional for Sprint 14 only and is not
# suitable for an untrusted or Internet-facing production network.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
