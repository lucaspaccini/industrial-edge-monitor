# Authenticated TLS listener for the single-host deployment.
listener 8883 0.0.0.0
allow_anonymous false
allow_zero_length_clientid false

cafile /run/mqtt-security/ca/ca.crt
certfile /run/mqtt-security/server/server.crt
keyfile /run/mqtt-security/server/server.key
require_certificate false
tls_version tlsv1.2

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /run/mqtt-security/mosquitto/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
