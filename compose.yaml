name: industrial-edge-monitor

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: industrial-edge-monitor-backend:local
  init: true
  restart: unless-stopped
  environment: &backend-environment
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    APP_NAME: ${APP_NAME:-Industrial Edge Monitor API}
    APP_VERSION: ${APP_VERSION:-0.1.0}
    APP_DESCRIPTION: ${APP_DESCRIPTION:-REST API for Industrial Edge Monitor}
    DATABASE_PATH: /data/telemetry.db
    DATABASE_TIMEOUT_SECONDS: ${DATABASE_TIMEOUT_SECONDS:-30}
    DEFAULT_HISTORY_LIMIT: ${DEFAULT_HISTORY_LIMIT:-100}
    MQTT_HOST: mqtt
    MQTT_PORT: "8883"
    MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-60}
    MQTT_TOPIC: ${MQTT_TOPIC:-industrial/telemetry}
    MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-industrial/devices}
    LEGACY_DEVICE_ID: ${LEGACY_DEVICE_ID:-legacy-device}
    DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-150}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  networks:
    - edge
  stop_grace_period: 15s

services:
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/ca/ca.crt:/run/mqtt-security/ca/ca.crt:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/server/server.crt:/run/mqtt-security/server/server.crt:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/server/server.key:/run/mqtt-security/server/server.key:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/mosquitto/dynamic-security.json:/run/mqtt-security/mosquitto/dynamic-security.json
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/clients/healthcheck.container.conf:/run/mqtt-security/clients/healthcheck.container.conf:ro
      - mqtt-data:/mosquitto/data
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - mosquitto_pub
        - -o
        - /run/mqtt-security/clients/healthcheck.container.conf
        - --topic
        - industrial/healthcheck
        - --message
        - ready
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s

  api:
    <<: *backend
    volumes:
      - sqlite-data:/data
    command:
      - python
      - -m
      - uvicorn
      - backend.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  collector:
    <<: *backend
    environment:
      <<: *backend-environment
      MQTT_CLIENT_ENABLED: "true"
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_CERT_PATH: /run/mqtt-client/ca.crt
      MQTT_USERNAME: ${MQTT_COLLECTOR_USERNAME:-collector}
      MQTT_PASSWORD_FILE: /run/mqtt-client/password
      MQTT_CLIENT_ID: ${MQTT_COLLECTOR_CLIENT_ID:-industrial-edge-collector}
    volumes:
      - sqlite-data:/data
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/ca/ca.crt:/run/mqtt-client/ca.crt:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/clients/collector.password:/run/mqtt-client/password:ro
    command:
      - python
      - -m
      - backend.collector.subscriber
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  simulator:
    <<: *backend
    profiles:
      - demo
    restart: "no"
    environment:
      <<: *backend-environment
      MQTT_CLIENT_ENABLED: "true"
      MQTT_TLS_ENABLED: "true"
      MQTT_CA_CERT_PATH: /run/mqtt-client/ca.crt
      MQTT_USERNAME: edge-node-02
      MQTT_PASSWORD_FILE: /run/mqtt-client/password
      MQTT_CLIENT_ID: iem-edge-node-02-simulator
      SIMULATOR_DEVICE_ID: edge-node-02
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-2}
      SIMULATOR_TEMPERATURE: ${SIMULATOR_TEMPERATURE:-32}
      SIMULATOR_HUMIDITY: ${SIMULATOR_HUMIDITY:-55}
      SIMULATOR_MACHINE_STATUS: ${SIMULATOR_MACHINE_STATUS:-running}
    volumes:
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/ca/ca.crt:/run/mqtt-client/ca.crt:ro
      - ${MQTT_SECURITY_DIR:-./.local/mqtt-security}/clients/edge-node-02.password:/run/mqtt-client/password:ro
    command:
      - python
      - -m
      - backend.simulator.publisher
    depends_on:
      mqtt:
        condition: service_healthy
      collector:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: industrial-edge-monitor-frontend:local
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 15s

networks:
  edge:
    driver: bridge

volumes:
  sqlite-data:
  mqtt-data:
