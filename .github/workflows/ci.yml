name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      DATABASE_PATH: /tmp/industrial-edge-monitor-tests/telemetry.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.4
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32
          path: firmware

      - name: Verify flash layout and application capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/check-firmware-layout.py \
            --application firmware/build/industrial_edge_monitor_firmware.bin
          grep --quiet '#define CONFIG_ESPTOOLPY_FLASHSIZE_4MB 1' firmware/build/config/sdkconfig.h
          grep --quiet -- '--flash-size", "4MB"' firmware/build/flasher_args.json
          grep --quiet '"0x40000" : "industrial_edge_monitor_firmware.bin"' \
            firmware/build/flasher_args.json

  containers:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      COMPOSE_PROJECT_NAME: iem-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull

      - name: Start stack and run smoke test
        shell: bash
        run: scripts/compose-security-smoke.sh

      - name: Run MQTT device lifecycle smoke test
        shell: bash
        run: scripts/mqtt-device-lifecycle-smoke.sh
