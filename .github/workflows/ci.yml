name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      DATABASE_PATH: /tmp/industrial-edge-monitor-tests/telemetry.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.4
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32
          path: firmware

  containers:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      COMPOSE_PROJECT_NAME: iem-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull

      - name: Start stack and run smoke test
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps || true
              docker compose logs --no-color || true
            fi
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          assert_shared_sqlite_volume() {
            local api_container collector_container api_volume collector_volume

            api_container="$(docker compose ps -q api)"
            collector_container="$(docker compose ps -q collector)"
            test -n "$api_container"
            test -n "$collector_container"

            api_volume="$(docker inspect --format \
              '{{range .Mounts}}{{if and (eq .Destination "/data") (eq .Type "volume")}}{{.Name}}{{end}}{{end}}' \
              "$api_container")"
            collector_volume="$(docker inspect --format \
              '{{range .Mounts}}{{if and (eq .Destination "/data") (eq .Type "volume")}}{{.Name}}{{end}}{{end}}' \
              "$collector_container")"

            test -n "$api_volume"
            test "$api_volume" = "$collector_volume"
          }

          docker compose up --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null

          collector_ready=0
          for attempt in {1..30}; do
            if docker compose logs collector 2>&1 \
                | grep --quiet "Subscribed to legacy and per-device topics"; then
              collector_ready=1
              break
            fi
            sleep 1
          done
          test "$collector_ready" -eq 1
          assert_shared_sqlite_volume

          docker compose exec -T mqtt mosquitto_pub \
            --host 127.0.0.1 \
            --port 1883 \
            --topic industrial/telemetry \
            --message '{"timestamp":"2026-08-01T00:00:00Z","temperature":23.75,"humidity":45.5,"machine_status":"unknown"}'

          telemetry_seen=0
          telemetry_json=""
          for attempt in {1..30}; do
            if telemetry_json="$(curl --fail --silent \
                "http://127.0.0.1:8000/telemetry/latest?device_id=legacy-device")" \
                && python3 -c "import json,sys; item=json.loads(sys.argv[1]); assert item['device_id']=='legacy-device' and item['temperature']==23.75" \
                  "$telemetry_json"; then
              telemetry_seen=1
              break
            fi
            sleep 1
          done
          test "$telemetry_seen" -eq 1
          telemetry_id="$(python3 -c \
            "import json,sys; print(json.loads(sys.argv[1])['id'])" \
            "$telemetry_json")"
          test -n "$telemetry_id"

          docker compose stop api collector
          docker compose rm --force api collector
          docker compose up --detach --wait --wait-timeout 180 api collector
          assert_shared_sqlite_volume

          persisted_json="$(curl --fail --silent --show-error \
            "http://127.0.0.1:8000/telemetry/latest?device_id=legacy-device")"
          python3 -c \
            "import json,sys; item=json.loads(sys.argv[1]); assert item['id']==int(sys.argv[2]) and item['device_id']=='legacy-device' and item['temperature']==23.75" \
            "$persisted_json" "$telemetry_id"
